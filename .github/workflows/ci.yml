name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v4.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
  hygiene:
    needs: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Commit conventions and sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse "$HEAD^")"
          fi
          for commit in $(git rev-list "$base..$HEAD"); do
            git show -s --format=%s "$commit" | grep -Eq '^(feat|fix|chore|docs|test|refactor|perf|build|ci|style|revert)(\([^)]*\))?!?: .+'
            author="$(git show -s --format='%an <%ae>' "$commit")"
            git show -s --format=%B "$commit" | grep -Fx "Signed-off-by: $author"
          done
      - name: Deployment freshness tests
        run: python3 -m unittest discover -s tests -v
      - run: git diff --exit-code HEAD
  website:
    needs: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Strict build and generated-site checks
        run: |
          python3 -m venv /tmp/site-build
          /tmp/site-build/bin/pip install -r requirements.txt
          /tmp/site-build/bin/zensical build --strict
          python3 tools/check_site.py
      - name: Serve and load generated site
        uses: edbfi/automation/actions/smoke@v4.0.0
        with:
          start-command: python3 -m http.server 4321 --bind 127.0.0.1 --directory .build
          url: http://127.0.0.1:4321/
          test-command: python3 tools/smoke_site.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: website-build
          path: .build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  required:
    name: ci / required
    if: always()
    needs: [guard, hygiene, website]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v4.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: edbfi/automation/actions/gate@v4.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard hygiene website
defaults:
  run:
    shell: bash
