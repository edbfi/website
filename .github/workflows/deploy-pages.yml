name: Deploy Website
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact current default revision; empty selects current master
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Select validated revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected-default-sha || github.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          test "$current" = "$DEPLOY_SHA"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - name: Require current successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: python3 tools/check_deploy.py
      - name: Build reviewed site
        run: |
          python3 -m venv /tmp/site-build
          /tmp/site-build/bin/pip install -r requirements.txt
          /tmp/site-build/bin/zensical build --strict
          python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .build
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Recheck revision and CI immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
        run: python3 tools/check_deploy.py
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
defaults:
  run:
    shell: bash
