name: Deploy Website
on:
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v2.0.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=master" > /tmp/runs.json
          python3 - <<'PYTHON'
          import json, os
          runs = json.load(open('/tmp/runs.json'))['workflow_runs']
          final = next((r for r in runs if r['event'] in {'push', 'workflow_dispatch'}), None)
          if not (final and final['head_sha'] == os.environ['GITHUB_SHA'] and final['head_branch'] == 'master' and final['status'] == 'completed' and final['conclusion'] == 'success'):
              raise SystemExit('Exact master commit has no successful final CI')
          PYTHON
      - name: Build reviewed site
        run: |
          python3 -m venv /tmp/site-build
          /tmp/site-build/bin/pip install -r requirements.txt
          /tmp/site-build/bin/zensical build --strict
          python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .build
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v2.0.0
        with:
          token: ${{ github.token }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
